[package]
name = "stream-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "stream_server"
path = "src/lib.rs"

[[bin]]
name = "infinity-stream"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
figment.workspace = true
mime_guess.workspace = true
rand.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
stream-core = { path = "../stream-core" }
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
# axum 0.7's Router implements the `tower` 0.5 `Service` trait directly (not
# the workspace-pinned 0.4), so pin the dev-only `tower` used for
# `ServiceExt::oneshot` in tests to match.
futures-util = "0.3"
http-body-util = "0.1"
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
